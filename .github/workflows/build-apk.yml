name: Build Android APKs

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  discover:
    name: Find Android Projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.scan.outputs.projects }}
    steps:
      - uses: actions/checkout@v4

      - name: Scan for Android projects
        id: scan
        run: |
          FOUND=$(find . -not -path '*/build/*' -path '*/app/src/main/AndroidManifest.xml' | sed 's|/app/src/main/AndroidManifest.xml||' | sed 's|^\./||' | sort -u | jq -R . | jq -sc .)
          echo "projects=$FOUND" >> "$GITHUB_OUTPUT"
          echo "Discovered: $FOUND"

  build:
    name: Build APK — ${{ matrix.project }}
    needs: discover
    if: ${{ needs.discover.outputs.projects != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > "${{ matrix.project }}/local.properties"

      - name: Build Debug APK
        working-directory: ${{ matrix.project }}
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-debug-${{ github.run_number }}
          path: ${{ matrix.project }}/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Build Release APK
        working-directory: ${{ matrix.project }}
        run: gradle assembleRelease

      - name: Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Signing secrets not configured — skipping."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystore.jks
          APK=$(find "${{ matrix.project }}/app/build/outputs/apk/release" -name "*.apk" | head -1)
          TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$TOOLS/apksigner" sign \
            --ks /tmp/keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "${APK%.*}-signed.apk" \
            "$APK"
          mv "${APK%.*}-signed.apk" "$APK"
          rm /tmp/keystore.jks

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-release-${{ github.run_number }}
          path: ${{ matrix.project }}/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.project }}/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
