name: Build Android APKs

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  discover:
    name: Discover Android Projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
      has_projects: ${{ steps.find.outputs.has_projects }}
    steps:
      - uses: actions/checkout@v4

      - name: Find Android projects
        id: find
        run: |
          projects=$(find . -path "*/app/src/main/AndroidManifest.xml" \
            | sed 's|/app/src/main/AndroidManifest.xml||' \
            | sed 's|^\./||' \
            | jq -R . | jq -s -c .)
          echo "projects=$projects" >> $GITHUB_OUTPUT
          if [ "$projects" = "[]" ]; then
            echo "has_projects=false" >> $GITHUB_OUTPUT
          else
            echo "has_projects=true" >> $GITHUB_OUTPUT
          fi

      - name: Print discovered projects
        run: echo "Found projects: ${{ steps.find.outputs.projects }}"

  build:
    name: Build ${{ matrix.project }}
    needs: discover
    if: needs.discover.outputs.has_projects == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > ${{ matrix.project }}/local.properties

      - name: Sanitize project name for artifact
        id: name
        run: echo "safe=$(echo '${{ matrix.project }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        working-directory: ${{ matrix.project }}
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.safe }}-debug-${{ github.run_number }}
          path: ${{ matrix.project }}/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Build Release APK
        working-directory: ${{ matrix.project }}
        run: gradle assembleRelease

      - name: Sign Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystore.jks
          APK_PATH=$(find ${{ matrix.project }}/app/build/outputs/apk/release -name "*.apk" | head -1)
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "${APK_PATH%.*}-signed.apk" \
            "$APK_PATH"
          mv "${APK_PATH%.*}-signed.apk" "$APK_PATH"
          rm /tmp/keystore.jks

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.safe }}-release-${{ github.run_number }}
          path: ${{ matrix.project }}/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.project }}/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
