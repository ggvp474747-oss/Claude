name: Build Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android-calculator/local.properties

      - name: Build Debug APK
        working-directory: android-calculator
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-debug-${{ github.run_number }}
          path: android-calculator/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Build Release APK
        working-directory: android-calculator
        run: gradle assembleRelease

      - name: Sign Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystore.jks
          APK_PATH=$(find android-calculator/app/build/outputs/apk/release -name "*.apk" | head -1)
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "${APK_PATH%.*}-signed.apk" \
            "$APK_PATH"
          mv "${APK_PATH%.*}-signed.apk" "$APK_PATH"
          rm /tmp/keystore.jks

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-release-${{ github.run_number }}
          path: android-calculator/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-calculator/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
